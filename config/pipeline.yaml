# Segmentation pipeline parameters (Section 2.5, Algorithm 1).

# Count-like features with heavy tails: log1p before standardisation.
log_columns:
  - beh_n_requests
  - beh_n_actions
  - beh_duration_s
  - beh_actions_per_min
  - beh_iat_median_s
  - tech_bytes_median
  - tech_ua_length
  - id_sessions_per_client
  - id_ua_per_client
  - id_account_age_days
  - id_n_devices
  - rep_complaints

# Missing values (sequence features below the action threshold, interval
# statistics of single-action sessions) are set to 0 after standardisation;
# the availability indicators listed here stay as features.
indicator_columns:
  - seq_valid

# PCA is applied only for density-based methods (R2 keeps centroid profiles
# in the original features).
pca_variance: 0.95
density_methods: [hdbscan]

# Number-of-segments selection: silhouette on the grid, stability = mean ARI
# between runs with different initialisations.
k_grid: [2, 3, 4, 5, 6, 7, 8]
n_inits: 5
stability_threshold: 0.8
silhouette_sample: 5000

methods:
  kmeans: {}                                   # k-means (Lloyd, k-means++ init, 10 restarts)
  gmm: {covariance_type: diag}                 # GaussianMixture
  hdbscan: {min_cluster_size_grid: [50, 100, 200, 400], min_samples: 5}
  agglo: {subsample: 5000}                     # Ward on a stratified subsample

# Rows of the ablation table: which families enter the matrix. The base
# configuration uses the families computable from the server log alone
# (id_log = the three log-derived identity features); the account-based
# identity and reputation features are an extension row.
ablation:
  full: [tech, beh, seq, id_log]
  with_account: [tech, beh, seq, id, rep]
  no_behavioural: [tech, seq, id_log]
  no_sequential: [tech, beh, id_log]
  technical_only: [tech]

# Rule anchor (knowledge-driven layer): bot user-agent signature OR all
# requests without referrer. The signature-only variant is reported as well.
rule_anchor:
  no_referrer_share: 1.0

# A candidate partition is admissible only if at least one segment has this
# share of rule-flagged sessions (the "covered by rules" threshold of
# Algorithm 2). Set to 0 to select k from silhouette and stability alone.
rule_segment_min_share: 0.9

# Algorithm 2: periodic operation on the real log (Section 3.4). Windows are
# local calendar days; clients are aggregated over the last n windows; a
# segment is "covered" by the rules at >= covered_share of flagged sessions
# and "outside" at <= outside_share. A segment is interpreted as automated
# when the rules flag most of it, or when its median profile is a multi-action
# session without any client-side beacon request.
operate:
  method: agglo
  families: full
  aggregation_windows: 7
  client_mode_share: 0.5
  covered_share: 0.9
  outside_share: 0.1
  automated_rule_share: 0.5
  automated_beacon_share_max: 0.0
  automated_min_actions: 5
