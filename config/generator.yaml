# Synthetic benchmark specification (Section 2.6).
#
# The generator writes a request log in the EClog file format, so the
# benchmark goes through the same preprocessing and feature code as the
# real data. Every number below is a documented parameter of the benchmark;
# class parameters were set from the exploration of the EClog one-day slice.

day: "2020-01-15"            # all sessions fall into this calendar day (UTC)
platform_country: PL
beacon_uri: /inne/informacja_online.php

# Share of sessions per client class. Automated classes sum to bot_share;
# run_generator.py can override bot_share and rescales the three bot classes
# proportionally.
class_shares:
  human: 0.80
  crawler: 0.10
  scraper: 0.06
  headless: 0.04

# Site model: URI templates follow the EClog shop so config/eclog_uri_types.yaml
# applies unchanged.
site:
  n_products: 6000
  n_categories: 120
  static_per_page:           # Poisson mean of image/script requests per page view
    human: 2.0
    crawler: 0.0
    scraper: 0.0
    headless: 2.0

# Start-of-session hour density for humans (24 weights, local time);
# automated classes start uniformly over the day.
diurnal_weights: [1, 0.6, 0.4, 0.3, 0.3, 0.4, 0.8, 1.5, 2.5, 3.2, 3.6, 3.8,
                  3.9, 3.7, 3.5, 3.4, 3.6, 4.0, 4.4, 4.6, 4.5, 3.8, 2.8, 1.8]

classes:
  human:
    sessions_per_client: {one: 0.75, max: 4}          # 1 w.p. 0.75, else uniform 2..max
    actions_per_session: {single: 0.55, geom_mean: 6} # 1 w.p. single, else 1 + geometric
    gap_s: {dist: lognormal, median: 12, sigma: 1.0}  # between consecutive actions
    beacon: {period_s: 8, jitter: 0.25}               # beacons during each dwell gap
    referrer: {external_first: 0.5, keep: 1.0}        # external referrer on first action; previous page later
    response_codes: {200: 0.96, 499: 0.02, 404: 0.01, 302: 0.01}
    countries: {PL: 0.92, DE: 0.03, US: 0.02, GB: 0.01, UA: 0.02}
    start: {home: 0.3, product: 0.4, category: 0.2, search: 0.1}
    transitions:
      home:     {category: 0.5, product: 0.2, search: 0.2, info: 0.1}
      category: {product: 0.45, category: 0.4, search: 0.05, home: 0.05, info: 0.05}
      product:  {product: 0.55, category: 0.2, cart: 0.1, search: 0.05, home: 0.03, info: 0.07}
      search:   {product: 0.5, search: 0.3, category: 0.15, home: 0.05}
      cart:     {checkout: 0.4, product: 0.3, category: 0.2, cart: 0.1}
      checkout: {checkout: 0.5, account: 0.2, cart: 0.1, product: 0.1, home: 0.1}
      account:  {checkout: 0.4, product: 0.3, home: 0.3}
      info:     {product: 0.3, category: 0.3, home: 0.2, info: 0.2}
      error:    {home: 0.4, category: 0.3, product: 0.3}
    account: {authenticated: 0.35, age_days_median: 300, devices_mean: 1.5,
              complaints_mean: 0.05, suspicious_email: 0.02}

  crawler:   # self-declared search-engine and service robots
    sessions_per_client: {poisson_mean: 5, min: 1}
    actions_per_session: {single: 0.1, geom_mean: 15}
    gap_s: {dist: lognormal, median: 200, sigma: 0.8}
    beacon: null
    referrer: {external_first: 0.0, keep: 0.0}
    response_codes: {200: 0.85, 404: 0.08, 301: 0.07}
    countries: {US: 0.5, DE: 0.15, NL: 0.1, FR: 0.05, PL: 0.1, IE: 0.1}
    start: {product: 0.4, search: 0.2, info: 0.2, category: 0.2}
    transitions:   # memoryless, diverse: same row for every state
      any: {product: 0.45, search: 0.22, info: 0.2, category: 0.06, error: 0.04, home: 0.03}
    account: {authenticated: 0.0, age_days_median: 0, devices_mean: 0, complaints_mean: 0.0, suspicious_email: 0.0}

  scraper:   # catalogue scrapers; browser or outdated user-agent, no client code
    sessions_per_client: {one: 0.4, max: 3}
    actions_per_session: {single: 0.05, geom_mean: 25}
    gap_s: {dist: lognormal, median: 1.5, sigma: 0.3}
    beacon: null
    referrer: {external_first: 0.0, keep: 0.1}
    response_codes: {200: 0.99, 404: 0.01}
    countries: {US: 0.3, RU: 0.2, CN: 0.15, PL: 0.15, DE: 0.1, SG: 0.1}
    start: {product: 0.8, category: 0.2}
    transitions:
      product:  {product: 0.97, category: 0.03}
      category: {category: 0.85, product: 0.15}
      any:      {product: 1.0}
    ua_pool: {modern: 0.5, outdated: 0.3, declared: 0.2}  # declared = python-requests, curl ...
    distributed: {share: 0.3, ids_min: 5, ids_max: 15}     # campaign over consecutive client ids
    account: {authenticated: 0.02, age_days_median: 5, devices_mean: 1, complaints_mean: 0.3, suspicious_email: 0.5}

  headless:  # headless browsers imitating users: client code runs, rhythm too regular
    sessions_per_client: {one: 0.6, max: 2}
    actions_per_session: {single: 0.05, geom_mean: 10}
    gap_s: {dist: lognormal, median: 8, sigma: 0.2}
    beacon: {period_s: 5, jitter: 0.0}
    referrer: {external_first: 0.3, keep: 1.0}
    response_codes: {200: 0.98, 404: 0.02}
    countries: {PL: 0.5, US: 0.2, DE: 0.1, NL: 0.1, RU: 0.1}
    start: {product: 0.7, category: 0.3}
    transitions:
      product:  {product: 0.6, category: 0.25, search: 0.1, cart: 0.05}
      category: {product: 0.7, category: 0.3}
      search:   {product: 0.8, search: 0.2}
      cart:     {product: 0.8, cart: 0.2}
      any:      {product: 1.0}
    account: {authenticated: 0.05, age_days_median: 10, devices_mean: 1, complaints_mean: 0.1, suspicious_email: 0.3}

bytes_median:   # response size by action type, lognormal with sigma 0.4
  home: 5000
  category: 7000
  product: 9000
  search: 6000
  cart: 4000
  checkout: 4000
  account: 3000
  info: 5000
  error: 2000
  beacon: 0
  static: 15000

